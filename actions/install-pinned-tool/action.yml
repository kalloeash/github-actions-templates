name: install-pinned-tool
description: >-
  Download a release asset, verify its checksum against the value published with the
  release, and install a single binary from it. The asset is a .tar.gz archive holding
  the binary, or the binary itself. The pin table inside the action owns the version,
  URL, and checksum for the catalog's tools; explicit url and checksum inputs override
  the table for anything else.
inputs:
  tool:
    description: >-
      Binary to install. actionlint, gitleaks, and trivy come from the pin table; any
      other name requires url and a checksum.
    required: true
  url:
    description: >-
      Release asset URL. Overrides the pin table. A URL ending in .tar.gz or .tgz is an
      archive; any other URL is the binary itself.
    required: false
    default: ""
  sha256:
    description: SHA-256 checksum of the asset. Required with url unless sha512 is given.
    required: false
    default: ""
  sha512:
    description: >-
      SHA-512 checksum of the asset, for releases that publish SHA-512 values. Give one
      checksum, not both.
    required: false
    default: ""
  archive-member:
    description: >-
      Path of the binary inside a .tar.gz archive. Defaults to the tool name. Rejected for
      a single-binary asset.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download, verify, and install
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        URL: ${{ inputs.url }}
        SHA256: ${{ inputs.sha256 }}
        SHA512: ${{ inputs.sha512 }}
        MEMBER: ${{ inputs.archive-member }}
      run: |
        # Input guards first, before the pin table may fill the checksum variables: two
        # checksums are ambiguous, and a checksum without url would be silently replaced
        # by the pin table's value.
        if [ -n "$SHA256" ] && [ -n "$SHA512" ]; then
          echo "::error::give sha256 or sha512, not both."
          exit 1
        fi
        if [ -z "$URL" ] && { [ -n "$SHA256" ] || [ -n "$SHA512" ]; }; then
          echo "::error::a checksum needs url; pin-table tools own their checksums."
          exit 1
        fi
        # The pin table: the one place where every catalog tool version and checksum
        # lives. Checksums are the values published with each release.
        if [ -z "$URL" ]; then
          case "$TOOL" in
            actionlint) # v1.7.12
              URL="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
              SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            gitleaks) # v8.30.1
              URL="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
              SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            trivy) # v0.72.0
              URL="https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz"
              SHA256="bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
              ;;
            *)
              echo "::error::'$TOOL' is not in the pin table; pass url and sha256 or sha512."
              exit 1
              ;;
          esac
        fi
        if [ -z "$SHA256" ] && [ -z "$SHA512" ]; then
          echo "::error::url needs sha256 or sha512."
          exit 1
        fi
        # A .tar.gz asset is an archive holding the binary; any other asset is the binary.
        case "$URL" in
          *.tar.gz | *.tgz) ARCHIVE=true ;;
          *) ARCHIVE=false ;;
        esac
        if [ "$ARCHIVE" = true ]; then
          MEMBER="${MEMBER:-$TOOL}"
          # The member is extracted into, and installed from, the temporary directory; a
          # path that escapes it must never reach tar or install.
          case "$MEMBER" in
            /* | ../* | */../* | */.. | ..)
              echo "::error::archive-member must be a relative path inside the archive."
              exit 1
              ;;
          esac
        elif [ -n "$MEMBER" ]; then
          echo "::error::archive-member applies to .tar.gz archives; this url is a single binary."
          exit 1
        fi
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        # --retry only covers transient failures; a changed or missing asset still fails.
        curl -sSfL --retry 3 -o "$tmp/download" "$URL"
        # Compared by value, so a moved or tampered release asset fails the job instead
        # of running.
        if [ -n "$SHA256" ]; then
          echo "$SHA256  $tmp/download" | sha256sum -c -
        else
          echo "$SHA512  $tmp/download" | sha512sum -c -
        fi
        if [ "$ARCHIVE" = true ]; then
          # Extract only the named member, never the whole archive.
          mkdir "$tmp/extract"
          tar -xzf "$tmp/download" -C "$tmp/extract" "$MEMBER"
          sudo install -m 0755 "$tmp/extract/$MEMBER" "/usr/local/bin/$TOOL"
        else
          sudo install -m 0755 "$tmp/download" "/usr/local/bin/$TOOL"
        fi
        command -v "$TOOL"
