# Scan dependency lockfiles and manifests for known vulnerabilities with OSV-Scanner. It
# reads the files and asks the OSV.dev database about the exact package versions, so there
# is no vulnerability database to download, no API key, and no cache to warm. Named by
# purpose, not tool, so the scanner can change without a consumer-breaking rename.
# osv-scanner is version pinned and checksum verified through the catalog's
# install-pinned-tool action. Callers usually run it on pull requests and on a weekly
# schedule, to catch advisories published after a change merged.
name: security-dependency-scan

on:
  workflow_call:
    inputs:
      scan-path:
        description: Directory scanned recursively for lockfiles and manifests, relative to the repository root.
        type: string
        default: "."
      lockfiles:
        description: >-
          Lockfiles to scan instead of scan-path, one path per line, relative to the
          repository root. Prefix a path with its format and a colon
          (package-lock.json:path/to/file) when the file name does not show the format.
        type: string
        default: ""
      config:
        description: >-
          Path to an osv-scanner.toml applied to every scanned file, relative to the
          repository root. Empty uses the osv-scanner.toml next to each scanned file, if any.
        type: string
        default: ""
      fail-on-vuln:
        description: Fail the run when a vulnerability is found that the config does not ignore.
        type: boolean
        default: true
      artifact-name:
        description: Name of the uploaded JSON report. Must be unique per workflow run when the block is called more than once.
        type: string
        default: dependency-scan-report
    outputs:
      vulnerability-count:
        description: Number of distinct advisories found, after the config's ignores.
        value: ${{ jobs.scan.outputs.vulnerability-count }}

permissions:
  contents: read

jobs:
  scan:
    name: dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      vulnerability-count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The catalog's own source, checked out at the exact commit of this workflow file,
      # so the block and the install action can never drift apart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catalog
          sparse-checkout: actions
          persist-credentials: false
      - name: Install osv-scanner
        uses: ./.catalog/actions/install-pinned-tool
        with:
          tool: osv-scanner
      # Keep the scanned tree equal to the caller's repository.
      - name: Remove the catalog checkout
        run: rm -rf .catalog
      - name: Scan dependencies
        id: scan
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          LOCKFILES: ${{ inputs.lockfiles }}
          CONFIG: ${{ inputs.config }}
        run: |
          args=(scan source --format json --output-file osv-results.json)
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          if [ -n "$LOCKFILES" ]; then
            while IFS= read -r lockfile; do
              if [ -n "$lockfile" ]; then args+=(--lockfile "$lockfile"); fi
            done <<<"$LOCKFILES"
          else
            args+=(--recursive "$SCAN_PATH")
          fi
          # Exit code 1 means vulnerabilities were found; the gate below decides what that
          # means. Anything else, such as 128 when no lockfile was found, is an error.
          status=0
          osv-scanner "${args[@]}" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::osv-scanner exited with $status."
            exit "$status"
          fi
          # One group is one advisory with its aliases (a GHSA and its CVE), counted once.
          count="$(jq '[.results[]?.packages[]?.groups[]?] | length' osv-results.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Write the summary
        env:
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          {
            echo "## Dependency scan"
            echo
            if [ "$COUNT" = "0" ]; then
              echo "No known vulnerabilities."
            else
              echo "$COUNT advisories found."
              echo
              echo "| Advisory | Severity | Package | Version | File |"
              echo "|----------|----------|---------|---------|------|"
              jq -r --arg ws "$GITHUB_WORKSPACE/" '
                .results[]? | (.source.path | ltrimstr($ws)) as $file
                | .packages[]? | .package as $pkg
                | .groups[]?
                | "| \(.ids | join(", ")) | \(.max_severity // "") | \($pkg.name) | \($pkg.version) | \($file) |"
              ' osv-results.json
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: osv-results.json
          if-no-files-found: ignore
      - name: Fail on vulnerabilities
        if: ${{ inputs.fail-on-vuln && steps.scan.outputs.count != '0' }}
        env:
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          echo "::error::$COUNT known vulnerabilities; see the job summary. Fix them, or ignore a reviewed finding in osv-scanner.toml."
          exit 1
