name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a quick follow-up commit cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Version and checksum live in the action's pin table.
      - name: Install actionlint
        uses: ./actions/install-pinned-tool
        with:
          tool: actionlint
      - name: Install zizmor
        run: pip install zizmor==1.31.1
      - name: Run pre-commit
        run: |
          pip install pre-commit==4.7.0
          SKIP=gitleaks pre-commit run --all-files --show-diff-on-failure

  # Calls the catalog's own block: one mechanism serves as the scan and as the block's
  # proof, and the gitleaks pin lives in one file.
  secret-scan:
    name: secret scan
    uses: ./.github/workflows/security-secret-scan.yml

  # The same for the dependency scan: the catalog scans its own lockfiles with its own
  # block.
  dependency-scan:
    name: dependency scan
    uses: ./.github/workflows/security-dependency-scan.yml
